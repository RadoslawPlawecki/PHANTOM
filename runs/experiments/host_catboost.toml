# Single-omic classification of the bacterial-host modality, one job per
# virus-identification tool. Run:  phantom run runs/experiments/host_catboost.toml
# Try a variant without editing:   phantom plan runs/experiments/host_catboost.toml --set model=rf

[run]
name = "host_catboost"
description = "Bacterial host prediction, all virus-identification tools, CatBoost"

[[steps]]
stage = "classification.single"
version = "1.0"
modality = "host"
vtool = ["geN", "VIB", "VS2"]
model = "catboost"
validators = ["loocv", "rcv"]
smote = false
