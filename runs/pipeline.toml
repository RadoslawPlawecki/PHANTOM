# The whole pipeline, from assemblies to classification results.
# Input: the raw folder data/raw -- one FASTA assembly per sample (any
# file name, or a folder per sample holding one), in data/raw/case/ and
# data/raw/control/: the folder gives the label. Samples become S1, S2, ...
# in path order; the mapping is written to data/samples.csv.
#   phantom run runs/setup.toml       # once: install the external tools
#   phantom plan runs/pipeline.toml   # optional: see what will run
#   phantom run runs/pipeline.toml
# Rerunning skips every job that is already up to date.

[run]
name = "pipeline"
description = "Raw assemblies -> viral genomes -> annotation -> features v1.0 -> classifiers"

# Samples and virus identification (one job per assembly, in parallel)

[[steps]]
stage = "preprocessing.samples"         # data/raw -> S<n>.fa links, mapping (id, assembly, label)

[[steps]]
stage = "tools.genomad"

[[steps]]
stage = "tools.vibrant"

[[steps]]
stage = "tools.virsorter2"

# Genomes, quality, labels

[[steps]]
stage = "preprocessing.collect"

[[steps]]
stage = "tools.checkv"

[[steps]]
stage = "preprocessing.masks"           # MQ/HQ: completeness >= 50/75 %, contamination < 10 %

[[steps]]
stage = "preprocessing.metadata"
targets = ["runtimes", "checkv", "sizes"]  # labels already come from the class folders

[[steps]]
stage = "preprocessing.visualize"

# Gene calling and annotation

[[steps]]
stage = "tools.phanotate"

[[steps]]
stage = "tools.phabox2"
tasks = ["cherry", "phagcn", "phavip"]  # host, taxonomy, gene function

# Features (version 1.0)

[[steps]]
stage = "features.import"
version = "1.0"
create = true
sources = ["data/phabox2/cherry", "data/phabox2/phagcn", "data/phabox2/phavip"]

[[steps]]
stage = "features.merge"
version = "1.0"
id_columns = { "phavip/*" = "Genome", "*" = "Accession" }

[[steps]]
stage = "features.preprocess"
version = "1.0"
mask = "MQ_vMAGs.tsv"                   # keep medium+ quality viral genomes only

[[steps]]
stage = "features.extract"
version = "1.0"
feature_col = { cherry = "ncbi_genus", phagcn = "genus" }
binary = true
min_patients = 2

# Classification

[[steps]]
stage = "classification.single"
version = "1.0"
modality = ["comp", "host", "func"]
model = "catboost"
validators = ["loocv", "rcv"]

[[steps]]
stage = "classification.multi"
version = "1.0"
fusion = ["early", "late"]
model = "catboost"
validators = ["loocv"]

[[steps]]
stage = "classification.figures"          # metric grids, confusion matrices, top features
version = "1.0"
model = "catboost"
