# The Python package: name, version, dependencies, the `phantom` command, and the
# settings of the development tools (pytest, coverage, ruff, mypy, codespell).

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom"
version = "1.0.0rc1"
description = "Phageome-based disease classification: from viral metagenomic assemblies to case/control classifiers."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Radosław Pławecki" },
    { name = "Kamil Szyc" },
    { name = "Sophia Bałdysz" },
]
maintainers = [{ name = "Radosław Pławecki" }]
keywords = ["phageome", "virome", "metagenomics", "bacteriophage", "machine learning", "classification"]
dependencies = [
    "catboost>=1.2.10",
    "imbalanced_learn>=0.14.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "scikit_learn>=1.9.1",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "tomlkit>=0.15.1",
    "tqdm>=4.70.1",
    "xgboost>=3.3.0"
]

[project.scripts]
phantom = "phantom.runner.cli:main"

[project.urls]
Repository = "https://github.com/RadoslawPlawecki/PHANTOM"

[project.optional-dependencies]
dev = [
    "ruff>=0.16.8",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3",
    "pytest-randomly>=5.0.0",
    "coverage[toml]>=7.16.1",
    "pre-commit>=4.0",
    "mypy>=1.14",
    "codespell>=2.4.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
pythonpath = ["."]
norecursedirs = ["_helpers", "golden"]
filterwarnings = [
    # seaborn's boxplot still passes matplotlib's deprecated `vert`; not ours to fix.
    "ignore:vert. bool was deprecated:matplotlib.MatplotlibDeprecationWarning:seaborn",
]
markers = [
    # The three kinds, set from the folder in tests/conftest.py; CI runs them in this order.
    "unit: one module or pipeline step on small data (tests/ except regression/, e2e/)",
    "regression: the example pipeline's results vs. the reviewed reference results (tests/regression/)",
    "e2e: the example pipeline through the command line, as a user runs it (tests/e2e/)",
    "critical: covers a business-critical path (labels, run planning)",
]

[tool.coverage.run]
branch = true
relative_files = true  # coverage files from the three CI test jobs combine
source = ["src/phantom"]
omit = [
    "*/__main__.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = [
    "E501",    # line length is owned by `ruff format`; don't also lint it in strings/comments
    "SIM108",  # ternary-instead-of-if — hurts readability as often as it helps
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # asserts are the point in tests
    "PLR2004", # magic values are fine in test data/assertions
]
"tools/check_outdated_deps.py" = [
    "S607", # deliberately resolves "pip" via PATH to hit the active venv's pip
]

[tool.ruff.lint.isort]
known-first-party = ["phantom"]

[tool.ruff.lint.flake8-bugbear]
# phantom.runner.parameters.param() wraps dataclasses.field() for stage Params,
# so a call to it as a dataclass default is intended, not a shared default.
extend-immutable-calls = ["phantom.runner.parameters.param"]

[tool.mypy]
ignore_missing_imports = true
[tool.codespell]
skip = "*.csv,*.tsv,*.json,.git,*.pdf"
ignore-words-list = "fpr,strat,holliday"
