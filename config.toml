# Virus identification tools

[tools]
geN = "genomad"
VIB = "vibrant"
VS2 = "virsorter2"

# Modalities

[modalities]
comp = { tool = "phagcn", tag = "PGN", label = "Virus taxonomy" }
host = { tool = "cherry", tag = "CHR", label = "Bacterial host prediction" }
func = { tool = "phavip", tag = "PHV", label = "Gene function" }

# Paths

[megahit]
path = "data/megahit"
type = "directory"
description = "Metagenome assemblies generated using the MEGAHIT assembler."


[genomad]
path = "data/genomad"
type = "directory"
description = "Viral sequence predictions and annotations generated using geNomad."
viral_fna = "*_assembly.contigs_virus.fna"


[vibrant]
path = "data/vibrant"
type = "directory"
description = "VIBRANT-based viral sequence annotations and auxiliary files."
viral_fna = "*_assembly.contigs.phages_combined.fna"


[virsorter2]
path = "data/virsorter2"
type = "directory"
description = "Viral sequence predictions and annotations generated using VirSorter2."
viral_fna = "final-viral-combined.fa"


[genomes]
path = "data/genomes"
type = "directory"
description = "Putative viral genomes identified by viral identification tools."
metadata_path = "data/genomes/genome_metadata.csv"


[checkv]
path = "data/checkv"
type = "directory"
description = "Genome quality assessment results generated using CheckV."


[masks]
path = "data/masks"
type = "directory"
description = "CheckV masks generated to filter sequences based on completeness and contamination criteria."


[phanotate]
path = "data/phanotate/orfs"
type = "directory"
description = "Open reading frames called from putative viral genomes using PHANOTATE."
orf_fna = "*_PHA_ORFs.fna"
genes = "data/phanotate/genes"
bed = "data/phanotate/bed"
proteins = "data/phanotate/proteins"


[phabox2]
path = "data/phabox2"
type = "directory"
description = "PhaBOX2 prediction tables per task (cherry, phagcn, phavip) and identification tool."


[functions]
path = "data/functions"
type = "directory"
description = "Called ORFs grouped by predicted functional category, with per-ORF genus and host annotations."


[results]
path = "results"
type = "directory"
description = "Experiment outputs, kept apart from data/: one subdirectory per run type and feature version."


[stamps]
path = ".phantom/stamps"
type = "directory"
description = "Per-job stamps (parameters + input fingerprints) written by `phantom run`, used to skip jobs that are already up to date."


# External tools (stages tools.*, run through workflow/Snakefile). Without
# [envs] / [software] entries every tool runs in a pinned conda environment
# created from workflow/envs/<tool>.yaml. Machine-specific choices (existing
# environments, local tool checkouts, core counts) go in config.local.toml.

[workflow]
snakefile = "workflow/Snakefile"  # relative to the repository
snakemake = ["snakemake"] # on PATH (environment.yml installs it)
workdir = ".phantom/snakemake"    # Snakemake's own metadata, relative to the workspace
cores = "all" # or a number


[databases]  # relative to the workspace
genomad = "genomad_db"
checkv = "checkv-db-v1.5"
phabox2 = "phabox_db_v2_2"
virsorter2 = "virsorter2_db"


[threads]  # per job; Snakemake runs jobs in parallel up to [workflow].cores
genomad = 1
vibrant = 5
virsorter2 = 1
checkv = 16
phabox2 = 40


[features]
path = "data/features"
type = "directory"
description = "Input features for classification, stored as dataset versions (1.0, 2.0, ...), not software versions."


