# The checks run before every `git push` (pre-commit install --hook-type pre-push):
# the same lint, format, type and spelling checks as CI.
default_install_hook_types: [pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-push]
      - id: check-merge-conflict
        stages: [pre-push]
      - id: check-added-large-files
        args: ["--maxkb=5000"]
        stages: [pre-push]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check .
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: ruff-format-check
        name: ruff format --check
        entry: ruff format --check .
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: codespell
        name: codespell
        entry: codespell
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: mypy
        name: mypy
        entry: mypy src/phantom
        language: system
        pass_filenames: false
        stages: [pre-push]

      # pre-commit shows a hook's output only once it ends; to watch the tests
      # pass one by one, pytest writes straight to the terminal when there is one.
      - id: pytest
        name: pytest (all tests)
        entry: >-
          bash -c 'if { : > /dev/tty; } 2> /dev/null;
          then exec pytest tests -v > /dev/tty 2>&1;
          else exec pytest tests -v; fi'
        language: system
        pass_filenames: false
        stages: [pre-push]
        verbose: true

      - id: pip-outdated
        name: outdated project dependencies (informational, never blocks)
        entry: python tools/check_outdated_deps.py
        language: system
        pass_filenames: false
        stages: [manual]
        verbose: true
